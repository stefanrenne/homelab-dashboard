# Example: the dashboard with Docker discovery through a read-only socket proxy.
services:
  dashboard:
    image: ghcr.io/stefanrenne/homelab-dashboard:latest
    ports:
      - "3000:3000"
    volumes:
      - ./config:/config
    environment:
      HD_VAR_PIHOLE_KEY: change-me     # used as {{HD_VAR_PIHOLE_KEY}} in services.yaml
    restart: unless-stopped
    healthcheck:                       # the image has the same one built in; here to tune it
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # docker.yaml:  local: { host: docker-proxy, port: 2375 }

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1   # read-only container list and inspect; everything else stays off
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # A container that shows up on the dashboard by itself:
  whoami:
    image: traefik/whoami
    labels:
      homelab.name: Whoami
      homelab.group: Tools
      homelab.icon: traefik.svg
      homelab.href: http://localhost:8081
    ports:
      - "8081:80"
