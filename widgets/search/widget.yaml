id: search
name: Search
version: 1.3.0
apiVersion: 1
description: Filters the dashboard's services as you type; Enter opens the only match, or searches the web.
options:
  provider: { type: enum, values: [duckduckgo, google, bing, startpage, baidu, brave, custom], default: duckduckgo }
  url: { type: string }   # for provider "custom": a URL with {q}, e.g. https://search.lan/?q={q}
  target: { type: enum, values: [_blank, _self], default: _blank }
  filter: { type: boolean, default: true }   # false: only search the web
  showSearchSuggestions: { type: boolean, default: false }   # suggestions from the search engine while typing
  suggestionUrl: { type: string }   # for provider "custom": an OpenSearch suggestion URL, query appended or at {q}
