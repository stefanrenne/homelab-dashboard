id: custom-api
aliases: [customapi]   # homepage's name
name: Custom API
version: 1.2.0
apiVersion: 1
description: Shows fields from any JSON API, without writing a widget. Mappings follow homepage's customapi.
refresh: 30s
options:
  url: { type: url, required: true }
  method: { type: enum, values: [GET, POST], default: GET }
  headers: { type: object, secret: true }
  body: { type: object }
  display: { type: enum, values: [block, list], default: block }   # list: one row per field
  # [{ field: data.count, label: Count, format: number|percent|bytes|text, scale: 100,
  #    prefix: "", suffix: "%", remap: [{ value: PLAYING, to: Playing }, { any: true, to: Other }] }]
  mappings: { type: list, required: true }
