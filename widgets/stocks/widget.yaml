id: stocks
name: Stocks
version: 1.0.0
apiVersion: 1
description: The price and day change of up to eight stocks, from Finnhub (homepage's stocks widget).
refresh: 1m
options:
  watchlist: { type: list, required: true }                  # ticker symbols, at most 8, e.g. [AAPL, MSFT, BRK.A]
  apiKey: { type: string, secret: true, required: true }     # or provider: finnhub (settings.yaml providers)
  color: { type: boolean, default: true }                     # green up, red down (the arrows show it either way)
  cache: { type: number, default: 1 }                         # minutes between calls to Finnhub
