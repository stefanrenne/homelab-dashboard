id: kubernetes
name: Kubernetes
version: 1.1.0
apiVersion: 1
description: CPU and memory of a Kubernetes cluster (the one the dashboard runs in, or kubernetes.yaml's kubeconfig), in total and per node (homepage's kubernetes widget).
refresh: 15s
options:
  # { show, cpu, memory, showLabel, label }: the cluster as a whole
  cluster: { type: object, default: { show: true, cpu: true, memory: true, showLabel: true, label: cluster } }
  # { show, cpu, memory, showLabel }: one line per node, labelled with its name
  nodes: { type: object, default: { show: true, cpu: true, memory: true, showLabel: true } }
  # filled in from the kubeconfig with kubernetes.yaml mode: default; without them the pod's service account
  url: { type: url }   # the API server, e.g. https://k8s.lan:6443
  token: { type: string, secret: true }
  username: { type: string, secret: true }
  password: { type: string, secret: true }
  tlsCa: { type: string, secret: true }     # PEM text of the cluster's CA
  tlsCert: { type: string, secret: true }   # PEM text of a client certificate
  tlsKey: { type: string, secret: true }    # PEM text of its key
  insecure: { type: boolean, default: false }   # skip the certificate check (insecure-skip-tls-verify)
