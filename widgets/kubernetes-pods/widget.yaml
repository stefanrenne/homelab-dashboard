id: kubernetes-pods
name: Kubernetes pods
version: 1.0.0
apiVersion: 1
description: State, CPU and memory of an app's pods. Used for services with "app:" (and "namespace:", "podSelector:"), as in homepage.
refresh: 15s
options:
  namespace: { type: string, default: default }
  app: { type: string }           # matches pods labelled app.kubernetes.io/name=<app>
  podSelector: { type: string }   # a label selector instead of app, e.g. app.kubernetes.io/instance in (a, b)
  # filled in from the kubeconfig with kubernetes.yaml mode: default; without them the pod's service account
  url: { type: url }   # the API server, e.g. https://k8s.lan:6443
  token: { type: string, secret: true }
  username: { type: string, secret: true }
  password: { type: string, secret: true }
  tlsCa: { type: string, secret: true }     # PEM text of the cluster's CA
  tlsCert: { type: string, secret: true }   # PEM text of a client certificate
  tlsKey: { type: string, secret: true }    # PEM text of its key
  insecure: { type: boolean, default: false }   # skip the certificate check (insecure-skip-tls-verify)
