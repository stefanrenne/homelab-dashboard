id: resources
name: System resources
version: 1.4.0
apiVersion: 1
description: CPU, memory, disk, CPU temperature, uptime and network of the machine (or container) the dashboard runs on, as meters like homepage.
refresh: 10s
options:
  cpu: { type: boolean, default: false }
  memory: { type: boolean, default: false }
  disk: { type: list, default: [] }          # mount points, e.g. ["/", "/media"], or one as text
  cputemp: { type: boolean, default: false } # the highest thermal zone (Linux)
  tempmin: { type: number }                  # bottom of the temperature bar (default 0 °C / 32 °F)
  tempmax: { type: number }                  # top of the temperature bar (default 100 °C / 212 °F)
  units: { type: enum, values: [metric, imperial], default: metric }   # for the CPU temperature
  uptime: { type: boolean, default: false }
  network: { type: string }                  # true for the default interface, or a name such as eno1 (Linux)
  diskUnits: { type: enum, values: [bytes, bbytes], default: bytes }   # bbytes: KiB, MiB, GiB (1024)
  expanded: { type: boolean, default: false } # also used / total, and the CPU load
  label: { type: string }                    # shown under the meters, e.g. "Media"
