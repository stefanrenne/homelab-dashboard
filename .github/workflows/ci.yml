name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # weekly rebuild of latest, so security fixes of the base image (node:22-alpine) reach the
  # image without a code change
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # the same LTS line as the image
          cache: npm
      # the tests load every widget from the widgets collection, at the release this version needs
      - uses: actions/checkout@v7
        with:
          repository: stefanrenne/homelab-dashboard-widgets
          ref: v0.4.0
          path: collection
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          HD_COLLECTION_DIR: collection

  # On a pull request the image is built and smoke-tested too, without pushing: an update of the
  # build actions or the base image is tested before it is merged.
  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # the version in the image: 1.2.3 for a tag v1.2.3, or for a run by hand on main (which
      # releases package.json's version unless it is released already; dependabot-automerge.yml
      # starts such runs too). Otherwise main-<short sha>, unless the commit carries a release
      # tag: the main build of a release commit (and the weekly rebuild) is that version too, so
      # `latest` never calls a release main-<sha>.
      - id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; rel=true
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]; then
            v=$(node -p "require('./package.json').version"); rel=true
            if gh release view "v$v" >/dev/null 2>&1; then echo "v$v is released already: a main build"; v="main-${GITHUB_SHA::7}"; rel=false; fi
          else v="main-${GITHUB_SHA::7}"; rel=false; fi
          if [[ "$v" == main-* ]]; then
            # a release tag on this commit (annotated tags show as <tag>^{})
            tag=$(git ls-remote --tags origin | awk -v sha="$GITHUB_SHA" '$1 == sha { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2 }' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [ -n "$tag" ]; then echo "this commit is release $tag"; v="${tag#v}"; fi
          fi
          { echo "version=$v"; echo "release=$rel"; echo "minor=${v%.*}"; } >> "$GITHUB_OUTPUT"
      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: homelab-dashboard:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name hd -p 3000:3000 homelab-dashboard:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:3000/api/health | grep -q '"version":"${{ steps.version.outputs.version }}"'
          curl -fs http://127.0.0.1:3000/api/layout | grep -q '"groups"'
          curl -fs http://127.0.0.1:3000/ | grep -q '<title>'
          docker logs hd
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.release == 'true' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ steps.version.outputs.release == 'true' }}
            type=sha,format=short
      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

  # A tag v1.2.3 becomes a GitHub release with that version's section of CHANGELOG.md. Run by
  # hand on main with a version not released yet, it creates the tag on that commit.
  release:
    needs: image
    if: needs.image.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          version="${{ needs.image.outputs.version }}"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for $version"; exit 1; fi
          printf '\n```bash\ndocker pull ghcr.io/%s:%s\n```\n' "$GITHUB_REPOSITORY" "$version" >> notes.md
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # a pushed tag must exist; by hand, the release creates the tag on this commit
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then target=(--target "$GITHUB_SHA"); else target=(--verify-tag); fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md "${target[@]}"
