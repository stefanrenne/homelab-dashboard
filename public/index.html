<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e293b" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<title>Homelab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap">
<style>
  /* Theme shades --t50 … --t950 are set from the colour palette (PALETTES below). */
  :root {
    --t50: #f8fafc; --t100: #f1f5f9; --t200: #e2e8f0; --t300: #cbd5e1; --t400: #94a3b8; --t500: #64748b;
    --t600: #475569; --t700: #334155; --t800: #1e293b; --t900: #0f172a; --t950: #020617;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --hd-bg: var(--t800);
    --hd-text: var(--t200);
    --hd-muted: var(--t300);
    --hd-heading: var(--t300);
    --hd-card: rgb(255 255 255 / .05);
    --hd-card-hover: rgb(255 255 255 / .1);
    --hd-block: color-mix(in srgb, var(--t900) 20%, transparent);
    --hd-tab: color-mix(in srgb, var(--t900) 50%, transparent);
    --hd-border: color-mix(in srgb, var(--t200) 20%, transparent);
    --hd-accent: var(--t400);
    --hd-shadow: color-mix(in srgb, var(--t900) 20%, transparent);
    /* status text: emerald-400, amber-400, rose-400 (≥ 5:1 on cards, tabs and blocks) */
    --hd-ok: #34d399;
    --hd-warn: #fbbf24;
    --hd-error: #fb7185;
    --hd-error-bg: rgb(136 19 55 / .8);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --hd-bg: var(--t50);
    --hd-text: var(--t700);
    --hd-muted: var(--t500);
    --hd-heading: var(--t800);
    --hd-card: #ffffff;
    --hd-card-hover: color-mix(in srgb, var(--t100) 70%, #ffffff);
    --hd-card-border: var(--t300);
    --hd-block: color-mix(in srgb, var(--t200) 50%, transparent);
    --hd-tab: color-mix(in srgb, var(--t500) 10%, transparent);
    --hd-border: color-mix(in srgb, var(--t800) 20%, transparent);
    --hd-accent: var(--t600);
    --hd-shadow: color-mix(in srgb, var(--t900) 10%, transparent);
    /* status text: emerald-700, amber-800, rose-700 (≥ 4.8:1 on cards, tabs and blocks) */
    --hd-ok: #047857;
    --hd-warn: #92400e;
    --hd-error: #be123c;
    --hd-error-bg: rgb(136 19 55 / .85);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font: 500 1rem/1.5 Manrope, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    letter-spacing: .1px;
    color: var(--hd-text);
    background-color: var(--hd-bg);
  }
  /* settings.background: the image on its own layer, so blur and brightness leave the text alone */
  #bg { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; pointer-events: none; }
  #bg::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(color-mix(in srgb, var(--hd-bg) 60%, transparent), color-mix(in srgb, var(--hd-bg) 85%, transparent)); }
  #bg[hidden] { display: none; }
  /* settings.cardBlur */
  .card-blur .card, .card-blur header.info.boxed { backdrop-filter: blur(var(--hd-card-blur)); -webkit-backdrop-filter: blur(var(--hd-card-blur)); }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1280px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
  @media (min-width: 640px) { .wrap { padding: max(36px, env(safe-area-inset-top)) max(36px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(36px, env(safe-area-inset-left)); } }
  .shadow { box-shadow: 0 4px 6px -1px var(--hd-shadow), 0 2px 4px -2px var(--hd-shadow); }

  /* header */
  h1.title { font-size: 1.5rem; font-weight: 600; margin: 0 0 16px; color: var(--hd-heading); }
  header.info { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
  header.info.boxed { background: var(--hd-card); border-radius: 6px; padding: 12px; border: 1px solid var(--hd-card-border, transparent); }
  header.info:empty { display: none; }
  .hw { flex: none; }
  .hw-search { flex: 1 1 260px; }
  .hw-datetime { flex: none; }

  .messages { margin-top: 16px; display: grid; gap: 8px; }
  .msg { border-radius: 6px; padding: 10px 14px; font-size: .8125rem; background: color-mix(in srgb, var(--hd-error) 25%, var(--hd-card)); }
  .msg.warn { background: color-mix(in srgb, var(--hd-warn) 18%, var(--hd-card)); }
  .msg summary { cursor: pointer; font-weight: 700; }
  .msg ul { margin: 8px 0 0; padding-left: 18px; }
  .msg code { font-size: .9em; opacity: .8; }

  /* groups */
  .groups { display: flex; flex-wrap: wrap; margin: 16px -4px 0; }
  .group { flex: 1 1 100%; padding: 4px; min-width: 0; }
  .group.layout-column { flex-basis: 100%; }
  @media (min-width: 768px) { .group.layout-column { flex-basis: 50%; } }
  @media (min-width: 1024px) { .group.layout-column { flex-basis: 33.333%; } }
  @media (min-width: 1280px) { .group.layout-column { flex-basis: 25%; } }
  .group h2 { margin: 0; font-size: 1.25rem; line-height: 1.75rem; font-weight: 500; color: var(--hd-heading); }
  .group h2 + .cards { margin-top: 12px; }
  .group-toggle { all: unset; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border-radius: 4px; }
  .group-toggle:focus-visible { outline: 2px solid var(--hd-accent); outline-offset: 2px; }
  .group-toggle svg { width: 16px; height: 16px; opacity: .55; transition: transform .15s; }
  .group-toggle:hover svg { opacity: 1; }
  .group.collapsed .group-toggle svg { transform: rotate(-90deg); }
  .group.collapsed .cards { display: none; }
  #groups.searching .group.collapsed .cards { display: grid; } /* search looks inside folded groups */
  .cards { display: grid; column-gap: 8px; grid-template-columns: 1fr; align-items: start; }
  @supports (grid-template-rows: masonry) { .cards { grid-template-rows: masonry; } } /* no holes; order kept */
  @media (min-width: 768px) { .group.layout-row .cards { grid-template-columns: repeat(min(2, var(--cols)), minmax(0, 1fr)); } }
  @media (min-width: 1024px) { .group.layout-row .cards { grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); } }

  /* service card */
  .card { position: relative; margin-bottom: 8px; padding: 4px; border-radius: 6px; background: var(--hd-card); transition: background .15s; min-width: 0;
    border: 1px solid var(--hd-card-border, transparent); }
  .card .names { padding-right: calc(var(--tag-count, 0) * 68px + 8px); } /* keep long names clear of the status labels */
  .card:hover { background: var(--hd-card-hover); }
  .card-head { display: flex; align-items: center; color: inherit; text-decoration: none; min-width: 0; cursor: default; }
  a.card-head { cursor: pointer; }
  .icon { width: 48px; height: 52px; flex: none; display: grid; place-items: center; }
  .icon img { width: 32px; height: 32px; object-fit: contain; }
  .icon.letter span { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: .875rem;
    background: color-mix(in srgb, var(--hd-text) 12%, transparent); }
  .names { flex: 1; min-width: 0; padding: 8px; font-size: .875rem; line-height: 1.25rem; }
  .card-head.no-icon .names { padding-left: 8px; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { font-size: .75rem; line-height: 1rem; font-weight: 400; color: var(--hd-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { position: absolute; top: 0; right: 0; margin-right: 8px; display: flex; gap: 8px; z-index: 1; }
  .tag { position: relative; padding: 2px 8px; border-radius: 0 0 4px 4px; background: var(--hd-tab); font-size: .6875rem; line-height: 1rem; font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
    color: var(--hd-muted); border: 0; cursor: default; min-width: 24px; text-align: center; }
  button.tag { cursor: pointer; }
  button.tag::before { content: ""; position: absolute; inset: -4px -4px -12px; } /* hit area ≥ 28 px high */
  .tag.up { color: var(--hd-ok); }
  .tag.down { color: var(--hd-error); }
  .tag.warn { color: var(--hd-warn); }

  /* widget content */
  .widget:empty { display: none; }
  .blocks { display: flex; flex-wrap: wrap; }
  .block { flex: 1 1 0; min-width: 64px; margin: 4px; padding: 4px; border-radius: 4px; background: var(--hd-block);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 44px; }
  .block .v { font-size: .875rem; line-height: 1.25rem; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; font-variant-numeric: tabular-nums; }
  .block .l { font-size: .75rem; line-height: 1rem; font-weight: 700; text-transform: uppercase; max-width: 100%;
    /* wrap to two lines (hyphenated in the page language) rather than cut a label off */
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; hyphens: auto; overflow-wrap: break-word; }
  .sym { display: inline-block; margin-right: 3px; font-size: .75em; vertical-align: .05em; }
  .block.ok .v { color: var(--hd-ok); }
  .block.warn .v { color: var(--hd-warn); }
  .block.error .v { color: var(--hd-error); }
  .rows { display: flex; flex-direction: column; }
  .row { position: relative; overflow: hidden; margin: 4px; padding: 4px; border-radius: 4px; background: var(--hd-block);
    display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .75rem; line-height: 1rem; }
  .row .rl { font-weight: 400; padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; z-index: 1; }
  .row .rv { font-weight: 500; text-align: right; white-space: nowrap; z-index: 1; }
  .row.ok .rv { color: var(--hd-ok); }
  .row.warn .rv, .row.warn .rl .sym { color: var(--hd-warn); }
  .row.error .rv, .row.error .rl .sym { color: var(--hd-error); }
  .row.more { justify-content: center; background: none; }
  .row.more .rl { font-weight: 600; padding-left: 0; }
  .row[tabindex] { cursor: pointer; }
  .row.expanded { align-items: flex-start; }
  .row.expanded .rl { white-space: normal; overflow-wrap: anywhere; }
  .row .progress { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--hd-text) 12%, transparent); }
  .api-error { margin: 4px; border-radius: 6px; background: var(--hd-error-bg); color: #f1f5f9; font-size: .75rem; text-align: center; }
  .api-error summary { cursor: pointer; padding: 8px; list-style: none; font-weight: 600; }
  .api-error summary::before { content: "ⓘ "; }
  .api-error div { padding: 0 10px 8px; text-align: left; overflow-wrap: anywhere; font-weight: 400; }

  /* bookmarks */
  /* settings.layout.<group>.tab */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 4px; }
  .tabs a { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 14px; border-radius: 6px; font-size: .875rem;
    color: var(--hd-text); text-decoration: none; background: var(--hd-card); border: 1px solid var(--hd-card-border, transparent); }
  .tabs a:hover { background: var(--hd-card-hover); }
  .tabs a[aria-current="page"] { background: var(--hd-tab); font-weight: 700; }
  [data-tab][hidden] { display: none !important; }
  .bookmarks { display: flex; flex-wrap: wrap; margin: 8px -4px 0; }
  .bookmarks .group { flex: 1 1 100%; }
  @media (min-width: 768px) { .bookmarks .group { flex-basis: 50%; } }
  @media (min-width: 1024px) { .bookmarks .group { flex-basis: 25%; } }
  .bm { display: flex; align-items: center; gap: 0; margin-bottom: 8px; border-radius: 6px; background: var(--hd-card); border: 1px solid var(--hd-card-border, transparent); color: inherit; text-decoration: none; font-size: .875rem; overflow: hidden; }
  .bm:hover { background: var(--hd-card-hover); }
  .bm .abbr { width: 40px; align-self: stretch; display: grid; place-items: center; font-weight: 700; font-size: .75rem; background: var(--hd-block); }
  .bm .abbr img { width: 20px; height: 20px; object-fit: contain; }
  .bm .bn { padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty { text-align: center; color: var(--hd-muted); padding: 64px 16px; border-radius: 6px; background: var(--hd-card); width: 100%; margin: 4px; }

  /* footer */
  footer { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; color: var(--hd-muted); }
  footer .right { display: flex; align-items: center; gap: 12px; }
  .icon-btn { background: none; border: 0; padding: 7px; min-width: 32px; min-height: 32px; cursor: pointer; color: var(--hd-text); opacity: .8;
    display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; }
  .icon-btn:hover { opacity: 1; }
  .icon-btn svg { width: 18px; height: 18px; }
  .appearance { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--hd-block); }
  .appearance .icon-btn[aria-pressed="true"] { opacity: 1; background: var(--hd-card-hover); }
  .palette { display: none; gap: 8px; flex-wrap: wrap; max-width: 560px; margin-left: 8px; }
  .palette.open { display: flex; }
  .swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatch.active { border-color: var(--hd-text); }
  .toast { position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px);
    display: flex; align-items: center; gap: 8px; background: var(--t900); color: var(--t100); padding: 4px 4px 4px 14px; border-radius: 6px;
    font-size: .8125rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .97; pointer-events: auto; }
  .toast.error { background: #881337; color: #fff1f2; }
  .toast .icon-btn { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--hd-accent); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
  @media (prefers-contrast: more) {
    :root[data-theme="dark"] { --hd-muted: var(--t200); --hd-heading: var(--t100); --hd-card-border: var(--t400); --hd-text: var(--t100); }
    :root[data-theme="light"] { --hd-muted: var(--t700); --hd-heading: var(--t900); --hd-card-border: var(--t500); --hd-text: var(--t900); }
    .tag { background: var(--hd-bg); }
  }
</style>
</head>
<body>
<div id="bg" aria-hidden="true" hidden></div>
<div class="wrap">
  <h1 class="title" id="title" hidden></h1>
  <header class="info" id="header-widgets"></header>
  <div class="messages" id="messages"></div>
  <nav id="tabs" class="tabs" hidden></nav>
  <main id="groups" class="groups" aria-live="polite"></main>
  <section id="bookmarks" class="bookmarks"></section>
  <footer>
    <div style="display:flex;align-items:center">
      <button class="icon-btn" id="color-btn" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10a2.5 2.5 0 0 0 2.5-2.5c0-.61-.23-1.2-.64-1.67a.53.53 0 0 1 .4-.83H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9Zm-5.5 11a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3Z"/></svg>
      </button>
      <div class="palette" id="palette"></div>
    </div>
    <div class="right">
      <button class="icon-btn" id="refresh-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <div class="appearance" role="group" id="appearance">
        <button class="icon-btn" type="button" data-appearance="light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn" type="button" data-appearance="auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" type="button" data-appearance="dark">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
    </div>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toast-text"></span>
  <button class="icon-btn" id="toast-close" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div class="sr-only" id="search-status" role="status" aria-live="polite"></div>

const SHADES = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];

let lang = 'en';
function translate(key, vars) {
  const text = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  return vars ? text.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m)) : text;
}

// Per-viewer choices (theme and colour) override settings.yaml; storage may be unavailable.
function stored(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function store(key, value) {
  try { localStorage.setItem(key, value); } catch { /* private mode */ }
}

// ---------------------------------------------------------------- helpers
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c !== null && c !== undefined) node.append(c);
  return node;
}

/** Blocks script-ish URLs; everything else (http, https, smb, ssh, relative) is allowed. */
function safeHref(href) {
  if (!href) return null;
  return /^\s*(javascript|data|vbscript):/i.test(href) ? null : href;
}

function iconNode(icon, name) {
  const box = el('span', { class: 'icon' });
  const letter = () => {
    box.classList.add('letter');
    box.replaceChildren(el('span', { text: (name || '?').trim().charAt(0).toUpperCase() }));
  };
  if (!icon) letter();
  else {
    const img = el('img', { src: icon, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
    img.addEventListener('error', letter);
    box.append(img);
  }
  return box;
}

function formatValue(value) {
  if (value === null || value === undefined) return '–';
  if (typeof value === 'number') return new Intl.NumberFormat(lang, { maximumFractionDigits: 1 }).format(value);
  return String(value);
}

/**
 * A message at the bottom. Information goes away after a while; an error stays until it is
 * closed (button or Escape), so nobody has to read it against a timer.
 */
function toast(text, { error = false } = {}) {
  const t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  t.classList.toggle('error', error);
  t.setAttribute('aria-live', error ? 'assertive' : 'polite');
  t.classList.add('show');
  clearTimeout(toast.timer);
  if (!error) toast.timer = setTimeout(hideToast, 6000);
}

function hideToast() {
  clearTimeout(toast.timer);
  document.getElementById('toast').classList.remove('show');
}

// ---------------------------------------------------------------- theme
const lightQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
function systemLight() {
  return Boolean(lightQuery && lightQuery.matches);
}
if (lightQuery && lightQuery.addEventListener) lightQuery.addEventListener('change', () => layout && applyTheme(layout.settings));

function applyTheme(settings) {
  const color = PALETTES[stored('hd-color')] ? stored('hd-color') : PALETTES[settings.color] ? settings.color : 'slate';
  const shades = PALETTES[color].split(' ');
  SHADES.forEach((s, i) => document.documentElement.style.setProperty(`--t${s}`, shades[i]));
  const choice = ['auto', 'light', 'dark'].includes(stored('hd-theme')) ? stored('hd-theme') : settings.theme;
  const theme = choice === 'auto' ? (systemLight() ? 'light' : 'dark') : choice;
  document.documentElement.dataset.theme = theme;
  document.getElementById('theme-color').setAttribute('content', theme === 'dark' ? shades[8] : shades[0]);
  for (const b of document.querySelectorAll('[data-appearance]')) b.setAttribute('aria-pressed', String(b.dataset.appearance === choice));
  const palette = document.getElementById('palette');
  palette.replaceChildren(...Object.keys(PALETTES).map((name) => {
    const b = el('button', { class: 'swatch' + (name === color ? ' active' : ''), type: 'button', title: name, 'aria-label': name });
    b.style.background = PALETTES[name].split(' ')[5];
    b.addEventListener('click', () => { store('hd-color', name); applyTheme(settings); });
    return b;
  }));
}

// ---------------------------------------------------------------- widgets
const clientModules = new Map(); // type -> Promise
const pollers = []; // { run(), timer }
let layout = null;

function widgetName(type) {
  return (layout.widgetTypes[type] && layout.widgetTypes[type].name) || type;
}

function widgetT(type) {
  const strings = (layout.widgetTypes[type] && layout.widgetTypes[type].i18n) || {};
  // `vars` fill {name} placeholders, e.g. { label: 'poolUsed', vars: { pool: 'Trunk' } } -> "Trunk used"
  return (key, vars) => {
    const text = Object.prototype.hasOwnProperty.call(strings, key) ? strings[key] : translate(key);
    return vars ? text.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m)) : text;
  };
}

/** A shape next to the colour for warn and error, so status is not carried by colour alone. */
function statusSymbol(status) {
  if (status !== 'warn' && status !== 'error') return null;
  const wrap = el('span', null, el('span', { class: 'sym', 'aria-hidden': 'true', text: status === 'warn' ? '▲' : '✕' }));
  wrap.append(el('span', { class: 'sr-only', text: translate(status === 'warn' ? 'attention' : 'problem') + ': ' }));
  return wrap;
}

/** A row icon is drawn for the eye and spoken as a word ("Playing"), never as "black triangle". */
function rowIcon(icon) {
  const glyph = { play: '▶', pause: '❚❚' }[icon];
  if (!glyph) return null;
  return el('span', null,
    el('span', { class: 'sym', 'aria-hidden': 'true', text: glyph }),
    el('span', { class: 'sr-only', text: translate(icon === 'play' ? 'playing' : 'paused') + ': ' }));
}

/** Rows that do not fit can be opened to show their full text (click, Enter or Space). */
function makeExpandable(row) {
  const toggle = () => {
    const open = row.classList.toggle('expanded');
    row.setAttribute('aria-expanded', String(open));
  };
  row.addEventListener('click', toggle);
  row.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggle();
    }
  });
  const check = () => {
    const label = row.querySelector('.rl');
    if (label.scrollWidth > label.clientWidth || row.classList.contains('expanded')) {
      row.tabIndex = 0;
      row.setAttribute('aria-expanded', String(row.classList.contains('expanded')));
    }
  };
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(check);
}

/** Turns a raw widget error into what went wrong and what to check, with the raw text as detail. */
function explainError(name, message) {
  const m = String(message || '');
  let key = 'errGeneric';
  if (/^invalid options|^unknown widget type/.test(m)) key = 'errConfig';
  else if (/answered (401|403)\b|unauthori[sz]ed|forbidden/i.test(m)) key = 'errAuth';
  else if (/answered 404\b|no environment/i.test(m)) key = 'errNotFound';
  else if (/answered 5\d\d\b/.test(m)) key = 'errServer';
  else if (/ECONNREFUSED|ENOTFOUND|EHOSTUNREACH|ENETUNREACH|ETIMEDOUT|ECONNRESET|EAI_AGAIN|fetch failed|timed out|socket hang up|unreachable/i.test(m)) key = 'errUnreachable';
  return translate(key, { name });
}

function apiError(name, message) {
  return el('details', { class: 'api-error' },
    el('summary', { text: explainError(name, message) }),
    el('div', null, el('span', { class: 'sr-only', text: translate('details') + ': ' }), message));
}

/** Renders a result the standard way: blocks, then rows. */
function renderResult(container, instance, result, name) {
  const t = widgetT(instance.type);
  container.replaceChildren();
  if (!result) return;
  if (!result.ok) {
    if (!instance.hideErrors) container.append(apiError(name || widgetName(instance.type), result.error));
    return;
  }
  const data = result.data || {};
  if (Array.isArray(data.blocks) && data.blocks.length) {
    const grid = el('div', { class: 'blocks' });
    for (const b of data.blocks) {
      const value = typeof b.value === 'string' ? t(b.value) : formatValue(b.value);
      // "22%" like homepage; other units get a space ("12 ms", "3 MB").
      const shown = b.unit && b.value !== null && b.value !== undefined ? `${value}${b.unit === '%' ? '' : ' '}${b.unit}` : value;
      const label = t(b.label, b.vars);
      const v = el('div', { class: 'v' }, statusSymbol(b.status), shown);
      grid.append(el('div', { class: 'block' + (b.status ? ' ' + b.status : ''), title: `${label}: ${shown}` },
        v, el('div', { class: 'l', text: label })));
    }
    container.append(grid);
  }
  if (Array.isArray(data.rows) && data.rows.length) {
    const list = el('div', { class: 'rows' });
    for (const r of data.rows) {
      const label = t(r.label, r.vars);
      const more = r.label === 'moreItems';
      const row = el('div', { class: 'row' + (r.status ? ' ' + r.status : '') + (more ? ' more' : ''), title: label });
      if (typeof r.progress === 'number') {
        const bar = el('div', { class: 'progress' });
        bar.style.width = `${r.progress}%`;
        row.append(bar);
      }
      const value = r.value === null || r.value === undefined ? '' : typeof r.value === 'string' ? t(r.value) : formatValue(r.value);
      row.append(el('span', { class: 'rl' }, statusSymbol(r.status), rowIcon(r.icon), label), el('span', { class: 'rv', text: value }));
      if (!more) makeExpandable(row);
      list.append(row);
    }
    container.append(list);
  }
}

/** Creates the DOM for one widget instance and starts polling its data. */
function mountWidget(instance, extraClass, name) {
  const box = el('div', { class: 'widget' + (extraClass ? ' ' + extraClass : '') });
  const type = layout.widgetTypes[instance.type];
  if (!instance.known || !type) {
    box.append(apiError(name || instance.type, `unknown widget type "${instance.type}"`));
    return box;
  }
  let custom = null;
  let last = null;
  const apply = (result) => {
    last = result;
    if (custom) {
      custom.error = result.ok || instance.hideErrors ? null : result.error;
      custom.data = result.ok ? result.data : null;
    } else if (!type.client) renderResult(box, instance, result, name);
  };
  if (type.client) {
    if (!clientModules.has(instance.type)) clientModules.set(instance.type, import(type.client));
    clientModules.get(instance.type).then(() => {
      custom = document.createElement(`hd-${instance.type}`);
      custom.options = instance.options;
      custom.t = widgetT(instance.type);
      custom.error = null;
      custom.data = null;
      box.replaceChildren(custom);
      if (last) apply(last);
    }, (err) => {
      box.replaceChildren(apiError(name || widgetName(instance.type), `${translate('clientFailed')}: ${err.message}`));
    });
  }
  if (instance.server) poll(instance, apply);
  return box;
}

function poll(instance, onResult) {
  const run = async () => {
    try {
      const res = await fetch(`/api/widgets/${encodeURIComponent(instance.instanceId)}`);
      onResult(await res.json());
    } catch (err) {
      onResult({ ok: false, error: translate('offline') });
    }
  };
  const every = Math.max(1000, instance.refreshMs || 30000);
  pollers.push({ run, timer: setInterval(() => { if (!document.hidden) run(); }, every) });
  run();
}

function stopPolling() {
  for (const p of pollers) clearInterval(p.timer);
  pollers.length = 0;
}

/**
 * A status label in the top-right corner of a card, like homepage: "78 ms" or "down" for
 * HTTP and ping checks, the container state ("healthy", "running") for Docker. Clicking a
 * container label shows the container's CPU and memory below the card.
 */
function statusTag(status, card) {
  const isContainer = status.kind === 'container';
  const tag = el(isContainer ? 'button' : 'div', { class: 'tag', type: isContainer ? 'button' : null, text: '·' });
  if (!status.known) {
    tag.textContent = '?';
    tag.title = `${translate('unknownWidget')}: ${status.type}`;
    return tag;
  }
  let stats = null;
  let last = null;
  if (isContainer) {
    tag.title = translate('containerStats');
    tag.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (stats) { stats.remove(); stats = null; return; }
      stats = el('div', { class: 'widget container-stats' });
      card.append(stats);
      renderResult(stats, { type: 'docker' }, last, card.dataset.name);
    });
  }
  poll(status, (result) => {
    last = result;
    const t = widgetT(status.type);
    const s = result.ok ? (result.data && result.data.status) || 'unknown' : 'down';
    tag.className = 'tag ' + s;
    let text;
    if (!result.ok) text = translate('tagDown');
    else if (result.data.statusText) text = t(result.data.statusText);
    else if (s === 'up' && typeof result.data.latency === 'number') text = `${Math.round(result.data.latency)} ms`;
    else text = s === 'down' ? translate('tagDown') : translate(s);
    tag.textContent = text;
    tag.setAttribute('aria-label', `${translate(s)}: ${text}`);
    if (!isContainer) tag.title = result.ok ? translate(s) : result.error;
    if (stats) renderResult(stats, { type: 'docker' }, result, card.dataset.name);
  });
  return tag;
}

// ---------------------------------------------------------------- page
function renderMessages(messages) {
  const box = document.getElementById('messages');
  box.replaceChildren();
  const section = (list, cls, title) => {
    if (!list.length) return;
    const ul = el('ul');
    for (const m of list) {
      ul.append(el('li', null, el('code', { text: `${m.file}${m.path ? ' › ' + m.path : ''}` }), ` ${m.message}`));
    }
    box.append(el('details', { class: 'msg ' + cls, open: cls === 'error' ? '' : null },
      el('summary', { text: `${title} (${list.length})` }), ul));
  };
  section(messages.errors, 'error', translate('errors'));
  section(messages.warnings, 'warn', translate('warnings'));
}

/**
 * `target: hidden-iframe` (homepage), e.g. a webhook: the dashboard server calls the URL and
 * says how it went, instead of a frame that can never report failure.
 */
async function runAction(service) {
  toast(translate('running', { name: service.name }));
  try {
    const res = await fetch(`/api/run/${encodeURIComponent(service.id)}`, { method: 'POST', headers: { 'x-requested-with': 'homelab-dashboard' } });
    const out = await res.json();
    if (out.ok) toast(translate('runOk', { name: service.name }));
    else toast(translate('runFailed', { name: service.name, reason: out.error || `HTTP ${out.status}` }), { error: true });
  } catch (err) {
    toast(translate('runFailed', { name: service.name, reason: translate('offline') }), { error: true });
  }
}

// ---------------------------------------------------------------- groups
/** Folded groups per viewer: { name: true|false }; settings.yaml's initiallyCollapsed is the default. */
function collapsedState() {
  try { return JSON.parse(stored('hd-collapsed') || '{}'); } catch { return {}; }
}

function groupToggle(g, section, cardsId) {
  const saved = collapsedState();
  const collapsed = g.name in saved ? saved[g.name] : g.layout.initiallyCollapsed === true;
  const button = el('button', { class: 'group-toggle', type: 'button', 'aria-controls': cardsId },
    el('span', { text: g.name }));
  button.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>');
  const apply = (value) => {
    section.classList.toggle('collapsed', value);
    button.setAttribute('aria-expanded', String(!value));
  };
  apply(collapsed);
  button.addEventListener('click', () => {
    const value = !section.classList.contains('collapsed');
    apply(value);
    store('hd-collapsed', JSON.stringify({ ...collapsedState(), [g.name]: value }));
  });
  return button;
}

function renderService(service) {
  const href = safeHref(service.href);
  const hidden = service.target === 'hidden-iframe';
  const head = el(href ? 'a' : 'div', {
    class: 'card-head' + (service.icon ? '' : ' no-icon'),
    href,
    target: href && !hidden ? service.target : null,
    rel: href ? 'noopener noreferrer' : null,
  });
  if (href && hidden) head.addEventListener('click', (e) => { e.preventDefault(); runAction(service); });
  // Discovered services look the same as configured ones; the source is in the tooltip.
  const name = el('div', { class: 'name', text: service.name, title: service.discovered ? `${service.name} (${translate('discovered')}: ${service.discovered})` : null });
  if (service.icon) head.append(iconNode(service.icon, service.name));
  head.append(el('div', { class: 'names' }, name, service.description ? el('div', { class: 'desc', text: service.description }) : null));
  const card = el('article', { class: 'card shadow', 'data-service': service.id, 'data-name': service.name }, head);
  card.dataset.search = [service.name, service.description || ''].join(' ').toLowerCase();
  if (service.statuses.length) {
    card.append(el('div', { class: 'tags' }, ...service.statuses.map((s) => statusTag(s, card))));
  }
  for (const w of service.widgets) card.append(mountWidget(w, null, service.name));
  card.style.setProperty('--tag-count', String(service.statuses.length));
  return card;
}

/** settings.background ({ image, blur, saturate, brightness, opacity }) and settings.cardBlur. */
function applyBackground(s) {
  const bg = document.getElementById('bg');
  const b = s.background;
  bg.hidden = !b;
  bg.style.backgroundImage = b ? `url("${encodeURI(b.image)}")` : '';
  const filters = [];
  if (b?.blur) filters.push(`blur(${b.blur}px)`);
  if (b?.saturate !== undefined) filters.push(`saturate(${b.saturate}%)`);
  if (b?.brightness !== undefined) filters.push(`brightness(${b.brightness}%)`);
  bg.style.filter = filters.join(' ');
  bg.style.opacity = b?.opacity !== undefined ? String(b.opacity / 100) : '';
  document.body.classList.toggle('card-blur', Boolean(s.cardBlur));
  document.body.style.setProperty('--hd-card-blur', s.cardBlur ? `${s.cardBlur}px` : '');
}

// ---------------------------------------------------------------- tabs
/** The tab in the URL hash (#name, lowercase and URI-encoded, as in homepage), else the first. */
function currentTab(tabs) {
  let hash = '';
  try { hash = decodeURIComponent(location.hash.slice(1)).toLowerCase(); } catch { /* a malformed hash */ }
  return tabs.find((t) => t.toLowerCase() === hash) ?? tabs[0];
}

function applyTab(tabs) {
  const current = currentTab(tabs);
  for (const a of document.querySelectorAll('#tabs a')) {
    if (a.dataset.name === current) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
  for (const section of document.querySelectorAll('[data-tab]')) section.hidden = section.dataset.tab !== current;
}

function renderTabs(tabs) {
  const nav = document.getElementById('tabs');
  nav.hidden = tabs.length === 0;
  nav.setAttribute('aria-label', translate('tabs'));
  nav.replaceChildren(...tabs.map((t) => el('a', { href: '#' + encodeURIComponent(t.toLowerCase()), 'data-name': t, text: t })));
  applyTab(tabs);
}
window.addEventListener('hashchange', () => applyTab(layout?.tabs ?? []));

function render(data) {
  stopPolling();
  layout = data;
  const s = data.settings;
  lang = I18N[s.language] ? s.language : 'en';
  document.documentElement.lang = s.language || 'en';
  document.title = s.title;
  applyTheme(s);
  applyBackground(s);
  const title = document.getElementById('title');
  title.textContent = s.title;
  title.hidden = false;
  title.classList.toggle('sr-only', s.showTitle === false); // a page keeps its h1 for screen readers

  const header = document.getElementById('header-widgets');
  header.className = 'info' + (s.headerStyle === 'clean' ? '' : ' boxed shadow');
  header.replaceChildren(...data.header.map((w) => mountWidget(w, 'hw hw-' + w.type)));

  renderMessages(data.messages);

  const groups = document.getElementById('groups');
  groups.replaceChildren();
  const visible = data.groups.filter((g) => g.services.length);
  if (!visible.length) {
    groups.append(el('div', { class: 'empty' }, el('p', { text: translate('empty') }), el('p', { text: translate('emptyHint') })));
  }
  for (const g of visible) {
    const cols = Number(g.layout.columns) || 0;
    const row = g.layout.style === 'row' || cols > 0;
    const section = el('section', { class: 'group ' + (row ? 'layout-row' : 'layout-column'), 'data-group': g.name, 'data-tab': g.layout.tab || null });
    const cards = el('div', { class: 'cards', id: `cards-${groups.children.length}` });
    if (g.layout.header === false) section.append(el('h2', { text: g.name, class: 'sr-only' }));
    else section.append(el('h2', null, groupToggle(g, section, cards.id)));
    cards.style.setProperty('--cols', cols || 4);
    for (const svc of g.services) cards.append(renderService(svc));
    section.append(cards);
    groups.append(section);
  }

  const bookmarks = document.getElementById('bookmarks');
  bookmarks.replaceChildren(...data.bookmarks.map((g) => {
    const section = el('section', { class: 'group', 'data-tab': g.layout?.tab || null }, el('h2', { text: g.name }));
    const list = el('div', { class: 'cards' });
    for (const b of g.bookmarks) {
      const abbr = el('span', { class: 'abbr' });
      if (b.icon) abbr.append(el('img', { src: b.icon, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }));
      else abbr.textContent = b.abbr || b.name.slice(0, 2).toUpperCase();
      list.append(el('a', { class: 'bm shadow', href: safeHref(b.href), target: '_blank', rel: 'noopener noreferrer', title: b.description || null },
        abbr, el('span', { class: 'bn', text: b.name })));
    }
    section.append(list);
    return section;
  }));

  renderTabs(data.tabs ?? []);

  for (const [id, key] of [['refresh-btn', 'refresh'], ['color-btn', 'color'], ['toast-close', 'close']]) {
    const b = document.getElementById(id);
    b.title = translate(key);
    b.setAttribute('aria-label', translate(key));
  }
  document.getElementById('appearance').setAttribute('aria-label', translate('appearance'));
  for (const b of document.querySelectorAll('[data-appearance]')) {
    const key = { light: 'appearanceLight', auto: 'appearanceAuto', dark: 'appearanceDark' }[b.dataset.appearance];
    b.title = translate(key);
    b.setAttribute('aria-label', translate(key));
  }
}

async function load() {
  try {
    const res = await fetch('/api/layout');
    render(await res.json());
  } catch (err) {
    document.getElementById('messages').replaceChildren(el('div', { class: 'msg', text: translate('offline') }));
    setTimeout(load, 5000);
  }
}

function connectEvents() {
  if (typeof EventSource === 'undefined') return;
  const events = new EventSource('/api/events');
  let timer = null;
  events.addEventListener('reload', () => {
    clearTimeout(timer);
    timer = setTimeout(load, 150);
  });
}

/** Shows only the cards and bookmarks that match every word of `query`; returns the matching cards. */
function filterServices(query) {
  const words = String(query || '').toLowerCase().split(/\s+/).filter(Boolean);
  const matches = [];
  for (const section of document.querySelectorAll('#groups .group, #bookmarks .group')) {
    const group = (section.dataset.group || '').toLowerCase();
    let visible = 0;
    for (const item of section.querySelectorAll('.card, .bm')) {
      const text = `${item.dataset.search || item.textContent.toLowerCase()} ${group}`;
      const hit = words.every((w) => text.includes(w));
      item.hidden = !hit;
      if (hit) {
        visible++;
        if (item.classList.contains('card')) matches.push(item);
      }
    }
    section.hidden = visible === 0;
  }
  document.getElementById('groups').classList.toggle('searching', words.length > 0);
  const status = document.getElementById('search-status');
  status.textContent = words.length ? (matches.length ? translate('matches', { count: matches.length }) : translate('noMatches')) : '';
  return matches;
}

document.addEventListener('hd-search-input', (e) => filterServices(e.detail && e.detail.query));
document.addEventListener('hd-search-submit', (e) => {
  // One service left: open it instead of searching the web.
  const matches = filterServices(e.detail && e.detail.query);
  const link = matches.length === 1 ? matches[0].querySelector('a.card-head') : null;
  if (!link) return;
  e.preventDefault();
  link.click();
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) for (const p of pollers) p.run();
});
document.getElementById('refresh-btn').addEventListener('click', () => load());
document.getElementById('toast-close').addEventListener('click', hideToast);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideToast(); });
for (const b of document.querySelectorAll('[data-appearance]')) {
  b.addEventListener('click', () => {
    store('hd-theme', b.dataset.appearance);
    if (layout) applyTheme(layout.settings);
  });
}
document.getElementById('color-btn').addEventListener('click', () => document.getElementById('palette').classList.toggle('open'));

window.HD = { I18N, PALETTES, translate, render, safeHref, formatValue, load, explainError, filterServices };
load();
connectEvents();
</script>
</body>
</html>
