name: Pages

# The documentation site (https://stefanrenne.github.io/homelab-dashboard/): docs/ plus the
# README as home page, built with Jekyll and the just-the-docs theme (docs/_config.yml).
on:
  push:
    branches: [main]
    paths: [docs/**, README.md, scripts/pages.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/pages.sh site-src "$GITHUB_REPOSITORY"
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site-src
          destination: _site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
