# Dashboard settings. See docs/configuration.md.
title: Homelab
language: en          # en, nl, fr, de, es
theme: auto           # auto, dark, light
color: slate          # any Tailwind colour: slate, gray, zinc, neutral, stone, red, orange, amber, yellow, lime,
                      # green, emerald, teal, cyan, sky, blue, indigo, violet, purple, fuchsia, pink, rose
showTitle: true       # false hides the title on the page (it stays the browser tab title)
headerStyle: boxed    # boxed: header widgets in a box; clean: without
target: _blank        # where service links open

layout:
  Infrastructure:
    columns: 2
  Media:
    columns: 1

discovery:
  interval: 30s

# Widgets from outside this repository. Pin a tag/commit or exact version.
plugins: []
#  - source: git+https://github.com/someone/hd-widget-pihole#v1.2.0
#  - source: npm:hd-widget-adguard@2.0.1
#  - path: ./my-widgets/garage-door
