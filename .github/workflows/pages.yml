name: Pages

# The documentation site (https://stefanrenne.github.io/homelab-dashboard/): docs/ plus the
# README as home page, and a page per widget (built-in, and the widgets collection at its newest
# release), built with Jekyll and the just-the-docs theme (docs/_config.yml).
on:
  push:
    branches: [main]
    paths: [docs/**, README.md, widgets/**, scripts/pages.sh, scripts/pages-widgets.mjs, .github/workflows/pages.yml]
  workflow_dispatch:
  # picks up a new release of the widgets collection
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Newest release of the widgets collection
        id: collection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh release view --repo stefanrenne/homelab-dashboard-widgets --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: stefanrenne/homelab-dashboard-widgets
          ref: ${{ steps.collection.outputs.tag }}
          path: collection
      - run: scripts/pages.sh site-src "$GITHUB_REPOSITORY" collection "${{ steps.collection.outputs.tag }}"
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site-src
          destination: _site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
