name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: homelab-dashboard:ci
          load: true
      - name: Smoke test
        run: |
          docker run -d --name hd -p 3000:3000 homelab-dashboard:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3000/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:3000/api/layout | grep -q '"groups"'
          docker logs hd
