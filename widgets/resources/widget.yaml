id: resources
name: System resources
version: 1.1.0
apiVersion: 1
description: CPU, memory and disk usage of the machine (or container) the dashboard runs on, as meters like homepage.
refresh: 10s
options:
  cpu: { type: boolean, default: false }
  memory: { type: boolean, default: false }
  disk: { type: list, default: [] }          # mount points, e.g. ["/", "/media"]
  label: { type: string }                    # shown under the meters, e.g. "Media"
