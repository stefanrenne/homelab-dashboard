id: openweathermap
name: OpenWeatherMap
version: 1.1.0
apiVersion: 1
description: The current weather from OpenWeatherMap, with your API key or a shared provider (homepage's openweathermap widget).
refresh: 5m
params: [latitude, longitude]   # the viewer's location, sent by client.js when the options have none
options:
  latitude: { type: number }                                  # without latitude and longitude: the browser's location (HTTPS)
  longitude: { type: number }
  apiKey: { type: string, secret: true, required: true }     # or provider: openweathermap (settings.yaml providers)
  label: { type: string }                                     # e.g. the city
  units: { type: enum, values: [metric, imperial], default: metric }
  cache: { type: number, default: 5 }                         # minutes between calls to OpenWeatherMap
  format: { type: object }                                    # Intl.NumberFormat options, e.g. { maximumFractionDigits: 1 }
